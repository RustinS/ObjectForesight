# Evaluation config for the released ObjectForesight-DiT (EPIC) model.
#
# Inherits the full training/model config (conf/epic.yaml) so the architecture
# always matches the released checkpoint, and overrides only eval-time settings:
# paper-style post-training filtering (mean-IoU >= 0.6, min translation 0.01 m)
# and sampler-based (DDIM) evaluation with canonicalized SE(3) metrics.
#
# Usage:
#   uv run python -m src.eval_main --config-name epic_eval \
#       eval.ckpt=checkpoints/of-epic-dit/best.pt data.dataset_root=./manip_data

defaults:
  - epic

data:
  post_train: true
  post_train_IoU_thresh: 0.6
  post_train_min_t: 0.01
  filter_iou_drop: false

eval:
  eval_mode: sampler
  compute_canon_metrics: true
  prefer_ema: false
